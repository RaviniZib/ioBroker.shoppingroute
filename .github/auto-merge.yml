# Only patch updates may be merged automatically after successful checks.
# The workflow independently blocks minor and major updates, including lockfile-only PRs.
- match:
    dependency_type: production
    update_type: "semver:patch"
- match:
    dependency_type: development
    update_type: "semver:patch"
- match:
    dependency_type: package-lock
    update_type: "semver:patch"
