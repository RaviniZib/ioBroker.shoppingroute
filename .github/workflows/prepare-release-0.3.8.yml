name: Prepare 0.3.8 Release

on:
  push:
    branches:
      - release/0.3.8
    paths:
      - '.github/workflows/prepare-release-0.3.8.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.3.8
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Apply 0.3.8 version and changelog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const VERSION = '0.3.8';
          const DATE = '2026-09-11';
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, value) => fs.writeFileSync(file, value);

          const pkg = JSON.parse(read('package.json'));
          pkg.version = VERSION;
          write('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const io = JSON.parse(read('io-package.json'));
          io.common.version = VERSION;
          const news038 = {
            en: 'Fixes the review queue so accepted items immediately update the article catalogue and remain “Accepted”, filters legacy market headers and nested sort prefixes, simplifies the current shopping-list Admin view, and updates CI/checker compatibility.',
            de: 'Behebt die Prüfliste: Übernommene Einträge aktualisieren den Artikelstamm sofort und bleiben „Übernommen“. Außerdem werden alte Marktüberschriften und verschachtelte Sortierpräfixe gefiltert, die aktuelle Einkaufsliste im Admin vereinfacht und CI/Checker-Kompatibilität aktualisiert.',
            ru: 'Исправлена очередь проверки: принятые позиции сразу обновляют каталог товаров и сохраняют статус «Принято». Также фильтруются старые заголовки магазинов и вложенные префиксы сортировки, упрощено отображение текущего списка покупок в Admin и обновлена совместимость CI/проверок.',
            pt: 'Corrige a fila de revisão: os itens aceites atualizam imediatamente o catálogo de artigos e mantêm o estado “Aceite”. Também filtra cabeçalhos de mercado antigos e prefixos de ordenação aninhados, simplifica a lista de compras atual no Admin e atualiza a compatibilidade de CI/verificador.',
            nl: 'Verbetert de controlelijst: geaccepteerde items werken de artikelcatalogus direct bij en blijven op “Overgenomen”. Ook worden oude winkelkoppen en geneste sorteerprefixen gefilterd, de actuele boodschappenlijst in Admin vereenvoudigd en de CI/checker-compatibiliteit bijgewerkt.',
            fr: 'Corrige la file de vérification : les éléments acceptés mettent immédiatement à jour le catalogue et conservent l’état « Accepté ». Filtre aussi les anciens en-têtes de magasin et les préfixes de tri imbriqués, simplifie la liste de courses actuelle dans Admin et met à jour la compatibilité CI/vérificateur.',
            it: 'Corregge la coda di revisione: gli elementi accettati aggiornano subito il catalogo e mantengono lo stato “Accettato”. Filtra inoltre le vecchie intestazioni dei negozi e i prefissi di ordinamento annidati, semplifica la lista della spesa corrente in Admin e aggiorna la compatibilità CI/checker.',
            es: 'Corrige la cola de revisión: los elementos aceptados actualizan inmediatamente el catálogo y conservan el estado «Aceptado». También filtra encabezados antiguos de tiendas y prefijos de ordenación anidados, simplifica la lista de compra actual en Admin y actualiza la compatibilidad de CI/verificador.',
            pl: 'Naprawia kolejkę weryfikacji: zaakceptowane pozycje natychmiast aktualizują katalog artykułów i zachowują status „Zaakceptowano”. Filtruje też stare nagłówki sklepów i zagnieżdżone prefiksy sortowania, upraszcza bieżącą listę zakupów w Adminie oraz aktualizuje zgodność CI/checkera.',
            uk: 'Виправлено чергу перевірки: прийняті позиції одразу оновлюють каталог товарів і зберігають статус «Прийнято». Також фільтруються старі заголовки магазинів і вкладені префікси сортування, спрощено поточний список покупок в Admin та оновлено сумісність CI/перевірок.',
            'zh-cn': '修复审核队列：已接受的条目会立即更新商品目录并保持“已接受”状态。同时过滤旧版商店标题和嵌套排序前缀，简化 Admin 中的当前购物清单视图，并更新 CI/检查器兼容性。'
          };
          const oldNews = io.common.news || {};
          io.common.news = Object.fromEntries([[VERSION, news038], ...Object.entries(oldNews).filter(([key]) => key !== VERSION)].slice(0, 7));
          write('io-package.json', `${JSON.stringify(io, null, 2)}\n`);

          let main = read('src/main.ts');
          main = main.replace("const VERSION = '0.3.7';", "const VERSION = '0.3.8';");
          if (!main.includes("const VERSION = '0.3.8';")) throw new Error('Runtime version replacement failed');
          write('src/main.ts', main);

          let readme = read('README.md');
          readme = readme.replace('**Current version: 0.3.7**', '**Current version: 0.3.8**');
          const enEntry = `## Changelog\n\n### ${VERSION} (${DATE})\n\n- Fixed the review queue so accepting an item updates the article catalogue and visible status immediately in the same Admin draft.\n- Legacy market headings such as \`— LIDL —\` are recognized as headings and can no longer enter the shopping items or review queue.\n- Nested internal sort prefixes are stripped recursively from parsing and the Admin shopping-list display.\n- Simplified the current shopping-list view by hiding empty market columns while retaining drag, arrow and market-selector controls.\n- Updated current ioBroker CI/checker compatibility: testing-action-check v2, Node.js 26 matrix coverage, current @iobroker/testing and bounded common.news history.\n`;
          readme = readme.replace('## Changelog\n', enEntry);
          write('README.md', readme);

          let readmeDe = read('README_DE.md');
          readmeDe = readmeDe.replace('**Aktuelle Version: 0.3.7**', '**Aktuelle Version: 0.3.8**');
          const deEntry = `## Changelog\n\n### ${VERSION} (${DATE})\n\n- Prüfliste korrigiert: „Übernehmen“ aktualisiert Artikelstamm und sichtbaren Status jetzt sofort im selben Admin-Entwurf.\n- Alte Marktüberschriften wie \`— LIDL —\` werden sicher als Überschriften erkannt und können nicht mehr als Artikel oder Prüflisteneintrag erscheinen.\n- Verschachtelte interne Sortierpräfixe werden beim Parsen und in der Admin-Einkaufslistenanzeige rekursiv entfernt.\n- Ansicht der aktuellen Einkaufsliste vereinfacht: leere Marktspalten bleiben verborgen; Drag&Drop, Pfeile und Marktauswahl bleiben parallel verfügbar.\n- Aktuelle ioBroker-CI-/Checker-Anforderungen übernommen: testing-action-check v2, Node.js 26 in der Matrix, aktuelles @iobroker/testing und auf sieben Einträge begrenzte common.news-Historie.\n`;
          readmeDe = readmeDe.replace('## Changelog\n', deEntry);
          write('README_DE.md', readmeDe);
          NODE

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Verify release version consistency
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const io = JSON.parse(fs.readFileSync('io-package.json', 'utf8'));
          const main = fs.readFileSync('src/main.ts', 'utf8');
          for (const [name, value] of [
            ['package', pkg.version],
            ['lock', lock.version],
            ['lock root', lock.packages[''].version],
            ['io-package', io.common.version],
          ]) if (value !== '0.3.8') throw new Error(`${name} version is ${value}`);
          if (!main.includes("const VERSION = '0.3.8';")) throw new Error('runtime version mismatch');
          if (Object.keys(io.common.news).length !== 7 || !io.common.news['0.3.8']) throw new Error('common.news is not release-ready');
          NODE

      - name: Lint, build and regression tests
        run: |
          npm run lint
          npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Package dry run
        run: npm pack --dry-run

      - name: Persist release commit without workflow changes
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows/prepare-release-0.3.8.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 0.3.8 release"
          git push origin HEAD:release/0.3.8
