name: Build 0.3.7 development

on:
  push:
    branches: [develop-0.3.7]
    paths:
      - '.github/upgrade-037.mjs'
      - '.github/fix-037-lint.mjs'
      - '.github/workflows/upgrade-037.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop-0.3.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Apply 0.3.7 development changes
        run: node .github/upgrade-037.mjs
      - name: Normalize generated lint style
        run: |
          node .github/fix-037-lint.mjs
          npx eslint src-admin/shopping-list-editor.js --fix
      - name: Lint
        run: npm run lint
      - name: Build and test
        run: npm test
      - name: Commit tested development result
        run: |
          rm -f .github/upgrade-037.mjs .github/fix-037-lint.mjs .github/workflows/upgrade-037.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Develop 0.3.7 interactive shopping list"
            git push origin HEAD:develop-0.3.7
          fi
