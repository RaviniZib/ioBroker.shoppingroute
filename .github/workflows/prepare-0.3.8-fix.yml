name: Prepare 0.3.8 Fix

on:
  push:
    branches:
      - fix-0.3.8-review-shopping-ui

permissions:
  contents: write
  actions: read

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-0.3.8-review-shopping-ui
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Apply deterministic fixes and checker cleanup
        run: |
          node scripts/prepare-0.3.8-fix.js
          node scripts/prepare-0.3.8-architecture.js
          node scripts/prepare-0.3.8-checker-cleanup.js

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install final dependency set
        run: npm ci

      - name: Format one-off and new Admin sources with project ESLint
        run: >-
          npx eslint
          src-admin/review-editor.js
          src-admin/shopping-list-editor.js
          scripts/prepare-0.3.8-fix.js
          scripts/prepare-0.3.8-architecture.js
          scripts/prepare-0.3.8-checker-cleanup.js
          scripts/update-0.3.8-build-hashes.js
          --fix

      - name: Lint and typecheck
        run: npm run lint

      - name: Build Admin and runtime
        run: npm run build

      - name: Update intentional bundle hashes
        run: node scripts/update-0.3.8-build-hashes.js

      - name: Run full regression suite
        run: node --test test/*.test.js

      - name: Verify no ioBroker object definitions changed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'v0.3.7:io-package.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync('io-package.json', 'utf8'));
          if (JSON.stringify(before.instanceObjects) !== JSON.stringify(after.instanceObjects)) {
            throw new Error('instanceObjects changed unexpectedly compared with v0.3.7');
          }
          console.log('io-package instanceObjects unchanged from v0.3.7.');
          NODE

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Package dry run
        run: npm pack --dry-run

      - name: Remove one-off preparation files before checker
        run: |
          git rm scripts/prepare-0.3.8-fix.js
          git rm scripts/prepare-0.3.8-architecture.js
          git rm scripts/prepare-0.3.8-checker-cleanup.js
          git rm scripts/update-0.3.8-build-hashes.js
          git rm .github/workflows/prepare-0.3.8-fix.yml

      - name: Run current official ioBroker repository checker locally
        shell: bash
        env:
          CHECKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'GITHUB_TOKEN=%s\n' "$CHECKER_TOKEN" > .repochecker.env
          set +e
          npx --yes @iobroker/repochecker@latest https://github.com/RaviniZib/ioBroker.shoppingroute --local --env .repochecker.env 2>&1 | tee repochecker.log
          CHECKER_EXIT=${PIPESTATUS[0]}
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('repochecker.log', 'utf8');
          const codes = [...new Set([...text.matchAll(/^\[([EWS]\d{4})\]/gm)].map(match => match[1]))].sort();
          const allowed = new Set(['E3032', 'W4001']);
          const unexpected = codes.filter(code => !allowed.has(code));
          console.log(`Repository checker codes: ${codes.join(', ') || 'none'}`);
          if (unexpected.length) {
            throw new Error(`Unexpected repository checker findings: ${unexpected.join(', ')}`);
          }
          if (!codes.includes('E3032')) {
            console.log('Historical release-workflow exception is already gone.');
          }
          NODE
          echo "Raw repochecker exit: $CHECKER_EXIT"
          rm -f .repochecker.env repochecker.log

      - name: Verify working tree
        run: |
          git diff --check
          git status --short

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix review status and shopping list presentation"
          git push origin HEAD:fix-0.3.8-review-shopping-ui
